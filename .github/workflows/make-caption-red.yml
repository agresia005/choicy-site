name: Make portal caption red

on:
  push:
    paths:
      - '.github/workflows/make-caption-red.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply readable red caption
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          pattern = re.compile(r'''    \.portal-caption\{.*?^    \}\n\n    \.portal-caption::before,\n    \.portal-caption::after\{.*?^    \}\n\n    \.portal-caption::after\{.*?^    \}\n\n    \.portal-ornament\{.*?^    \}\n''', re.M | re.S)

          replacement = '''    .portal-caption{\n      display:flex;\n      align-items:center;\n      justify-content:center;\n      gap:12px;\n      font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;\n      font-size:clamp(20px,1.5vw,30px);\n      font-weight:650;\n      letter-spacing:.15em;\n      text-transform:uppercase;\n      color:#ff4a3d;\n      -webkit-text-stroke:1.25px #5a2018;\n      paint-order:stroke fill;\n      text-shadow:\n        0 1px 0 #2c120d,\n        0 2px 0 #2c120d,\n        0 3px 8px rgba(25,8,5,.96),\n        0 0 10px rgba(255,74,61,.46),\n        0 0 22px rgba(255,74,61,.24);\n      white-space:nowrap;\n      transform-origin:center;\n      animation:portal-heartbeat 1.55s ease-in-out infinite;\n    }\n\n    .portal-caption::before,\n    .portal-caption::after{\n      content:"";\n      width:clamp(34px,3vw,58px);\n      height:1px;\n      background:linear-gradient(90deg,transparent,#ff5b50);\n      box-shadow:0 0 8px rgba(255,74,61,.52);\n    }\n\n    .portal-caption::after{\n      background:linear-gradient(90deg,#ff5b50,transparent);\n    }\n\n    .portal-ornament{\n      display:block;\n      margin-top:2px;\n      font-family:Georgia,"Times New Roman",serif;\n      font-size:clamp(12px,.85vw,16px);\n      letter-spacing:.34em;\n      color:#ff6a60;\n      -webkit-text-stroke:.45px #5a2018;\n      text-shadow:0 1px 4px rgba(25,8,5,.96),0 0 9px rgba(255,74,61,.45);\n    }\n'''

          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'caption block replacement count={n}')

          p.write_text(s2, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Switch portal caption to readable red"
          git push
