name: Refine lead and brand typography

on:
  push:
    paths:
      - '.github/workflows/refine-lead-brand.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply focused typography refinements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          brand = '''    .hero-brand{
              position:absolute;
              z-index:5;
              top:clamp(24px,3vw,42px);
              left:clamp(24px,4vw,60px);
              font-size:clamp(19px,1.35vw,25px);
              font-weight:800;
              letter-spacing:.19em;
              text-transform:uppercase;
              background:linear-gradient(180deg,#fff2c8 0%,#e6c277 42%,#b17b35 100%);
              -webkit-background-clip:text;
              background-clip:text;
              color:transparent;
              -webkit-text-stroke:.75px rgba(255,255,255,.92);
              text-shadow:0 1px 2px rgba(0,0,0,.45);
            }'''

          lead = '''    .lead{
              margin:32px 0 0;
              position:relative;
              left:0;
              display:block;
              width:max-content;
              max-width:100%;
              white-space:nowrap;
              font-family:"Arial Black",Inter,ui-sans-serif,system-ui,sans-serif;
              font-size:clamp(28px,2.05vw,38px);
              line-height:1.05;
              font-weight:900;
              letter-spacing:.075em;
              text-transform:uppercase;
              color:rgba(255,255,255,.93);
              text-shadow:0 2px 12px rgba(0,0,0,.46);
              transform:scaleX(1.22);
              transform-origin:left center;
            }'''

          s, n1 = re.subn(r'(?ms)^    \.hero-brand\{.*?^    \}', brand, s, count=1)
          s, n2 = re.subn(r'(?ms)^    \.lead\{.*?^    \}', lead, s, count=1)

          s = s.replace(
            '<p class="lead"><span>Fashion</span><span>·</span><span>Product</span><span>·</span><span>Film</span></p>',
            '<p class="lead">Fashion · Product · Film</p>'
          )

          s = re.sub(
            r'      \.hero-brand\{[^\n]*\}',
            '      .hero-brand{top:20px;left:18px;font-size:16px;-webkit-text-stroke:.55px rgba(255,255,255,.88)}',
            s,
            count=1
          )

          s = re.sub(
            r'(?ms)^      \.lead\{.*?^      \}',
            '''      .lead{
                margin-top:22px;
                left:0;
                width:auto;
                max-width:100%;
                font-size:15px;
                font-weight:900;
                letter-spacing:.07em;
                transform:none;
              }''',
            s,
            count=1
          )

          if n1 != 1 or n2 != 1:
              raise SystemExit(f'CSS blocks not found: hero-brand={n1}, lead={n2}')

          checks = [
              '-webkit-text-stroke:.75px rgba(255,255,255,.92);',
              'font-family:"Arial Black",Inter,ui-sans-serif,system-ui,sans-serif;',
              'transform:scaleX(1.22);',
              '<p class="lead">Fashion · Product · Film</p>'
          ]
          missing = [x for x in checks if x not in s]
          if missing:
              raise SystemExit(f'Missing expected changes: {missing}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes and remove one-time workflow
        run: |
          rm -f .github/workflows/refine-lead-brand.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/refine-lead-brand.yml
          git commit -m "Strengthen secondary line and brand contrast"
          git push
