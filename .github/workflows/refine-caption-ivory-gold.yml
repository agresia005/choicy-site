name: Refine portal caption ivory gold

on:
  push:
    paths:
      - '.github/workflows/refine-caption-ivory-gold.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply ivory gold caption treatment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('''      font-size:clamp(18px,1.35vw,26px);\n      font-weight:400;\n      letter-spacing:.20em;\n      text-transform:uppercase;\n      color:#f3e4b8;\n      -webkit-text-stroke:1.1px #4a2b18;\n      paint-order:stroke fill;\n      text-shadow:\n        0 2px 4px rgba(35,18,8,.96),\n        0 0 8px rgba(255,224,164,.34),\n        0 0 18px rgba(255,208,118,.18);''','''      font-size:clamp(20px,1.5vw,30px);\n      font-weight:600;\n      letter-spacing:.16em;\n      text-transform:uppercase;\n      color:#fffaf0;\n      -webkit-text-stroke:1.45px #c89a4b;\n      paint-order:stroke fill;\n      text-shadow:\n        0 1px 0 #4a2b18,\n        0 2px 0 #4a2b18,\n        0 3px 7px rgba(35,18,8,.92),\n        0 0 10px rgba(233,190,104,.42),\n        0 0 22px rgba(233,190,104,.18);''')

          s = s.replace('''      background:linear-gradient(90deg,transparent,#e8c680);\n      box-shadow:0 0 7px rgba(232,198,128,.38);''','''      background:linear-gradient(90deg,transparent,#d6ad5d);\n      box-shadow:0 0 7px rgba(214,173,93,.40);''')
          s = s.replace('''      background:linear-gradient(90deg,#e8c680,transparent);''','''      background:linear-gradient(90deg,#d6ad5d,transparent);''')
          s = s.replace('''      color:#e8c680;\n      -webkit-text-stroke:.35px #4a2b18;\n      text-shadow:0 1px 5px rgba(35,18,8,.95),0 0 8px rgba(232,198,128,.32);''','''      color:#f6dfac;\n      -webkit-text-stroke:.45px #7a5428;\n      text-shadow:0 1px 4px rgba(35,18,8,.96),0 0 8px rgba(214,173,93,.38);''')

          s = s.replace('''        font-size:clamp(18px,5vw,25px);\n        letter-spacing:.15em;''','''        font-size:clamp(20px,5.4vw,27px);\n        letter-spacing:.13em;''')

          checks = ['color:#fffaf0;', '-webkit-text-stroke:1.45px #c89a4b;', 'font-weight:600;', 'font-size:clamp(20px,1.5vw,30px);']
          missing = [x for x in checks if x not in s]
          if missing:
              raise SystemExit(f'Missing expected caption styles: {missing}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine portal caption ivory gold contrast"
          git push
