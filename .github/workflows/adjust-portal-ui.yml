name: Adjust portal UI

on:
  push:
    paths:
      - '.github/workflows/adjust-portal-ui.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move QR and add heartbeat caption
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'radial-gradient(circle at 74.5% 40%,rgba(255,220,160,.08),transparent 28%),',
              'radial-gradient(circle at 72.5% 44.5%,rgba(255,220,160,.08),transparent 28%),',
              1
          )

          s = s.replace(
              '      left:74.5%;\n      top:40.5%;\n      transform:translate(-50%,-50%);\n      width:clamp(320px,23vw,440px);',
              '      left:72.5%;\n      top:44.5%;\n      transform:translate(-50%,-50%);\n      width:clamp(320px,23vw,440px);',
              1
          )

          s = s.replace('      color:#fff3dc;', '      color:#ff3b30;', 1)
          s = s.replace(
              '      text-shadow:\n        0 2px 9px rgba(35,18,8,.95),\n        0 0 16px rgba(255,220,160,.34);\n      white-space:nowrap;',
              '      text-shadow:\n        0 2px 10px rgba(35,8,8,.96),\n        0 0 10px rgba(255,59,48,.78),\n        0 0 24px rgba(255,59,48,.42);\n      white-space:nowrap;\n      transform-origin:center;\n      animation:portal-heartbeat 1.35s ease-in-out infinite;',
              1
          )

          s = s.replace(
              '      background:linear-gradient(90deg,transparent,#f4d5a1);\n      box-shadow:0 0 7px rgba(244,213,161,.42);',
              '      background:linear-gradient(90deg,transparent,#ff5a52);\n      box-shadow:0 0 8px rgba(255,59,48,.52);',
              1
          )
          s = s.replace(
              '      background:linear-gradient(90deg,#f4d5a1,transparent);',
              '      background:linear-gradient(90deg,#ff5a52,transparent);',
              1
          )
          s = s.replace(
              '      color:#f0c987;\n      text-shadow:0 1px 6px rgba(35,18,8,.92),0 0 8px rgba(255,210,128,.35);\n    }\n\n    @media(max-width:760px){',
              '      color:#ff6a61;\n      text-shadow:0 1px 6px rgba(35,8,8,.94),0 0 10px rgba(255,59,48,.45);\n    }\n\n    @keyframes portal-heartbeat{\n      0%,100%{transform:scale(1)}\n      12%{transform:scale(1.08)}\n      24%{transform:scale(1)}\n      36%{transform:scale(1.05)}\n      52%{transform:scale(1)}\n    }\n\n    @media(max-width:760px){',
              1
          )

          required = [
              'left:72.5%;',
              'top:44.5%;',
              'color:#ff3b30;',
              '@keyframes portal-heartbeat',
              'animation:portal-heartbeat 1.35s ease-in-out infinite;'
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit(f'Missing expected changes: {missing}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move QR and animate red contact caption"
          git push
