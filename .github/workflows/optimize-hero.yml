name: Optimize hero image

on:
  push:
    paths:
      - '.github/workflows/optimize-hero.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert hero PNG to WebP
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path("assets/hero.png")
          dst = Path("assets/hero.webp")
          img = Image.open(src).convert("RGB")
          img.save(dst, "WEBP", quality=82, method=6)
          print(f"{src.stat().st_size} -> {dst.stat().st_size} bytes")
          PY

      - name: Point the page at WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = 'url("assets/hero.png")'
          new = 'url("assets/hero.webp")'
          if old not in s:
              raise SystemExit("Expected hero.png reference not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit optimized hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero.webp index.html
          git commit -m "Optimize hero background" || exit 0
          git push
