name: Update portal caption style

on:
  push:
    paths:
      - '.github/workflows/update-caption-style.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply readable gold outlined caption
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('''      color:#ff3b30;\n      text-shadow:\n        0 2px 10px rgba(35,8,8,.96),\n        0 0 10px rgba(255,59,48,.78),\n        0 0 24px rgba(255,59,48,.42);\n      white-space:nowrap;\n      transform-origin:center;\n      animation:portal-heartbeat 1.35s ease-in-out infinite;''','''      color:#f3e4b8;\n      -webkit-text-stroke:1.1px #4a2b18;\n      paint-order:stroke fill;\n      text-shadow:\n        0 2px 4px rgba(35,18,8,.96),\n        0 0 8px rgba(255,224,164,.34),\n        0 0 18px rgba(255,208,118,.18);\n      white-space:nowrap;\n      transform-origin:center;\n      animation:portal-heartbeat 1.55s ease-in-out infinite;''')
          s = s.replace('''      background:linear-gradient(90deg,transparent,#ff5a52);\n      box-shadow:0 0 8px rgba(255,59,48,.52);''','''      background:linear-gradient(90deg,transparent,#e8c680);\n      box-shadow:0 0 7px rgba(232,198,128,.38);''')
          s = s.replace('''      background:linear-gradient(90deg,#ff5a52,transparent);''','''      background:linear-gradient(90deg,#e8c680,transparent);''')
          s = s.replace('''      color:#ff6a61;\n      text-shadow:0 1px 6px rgba(35,8,8,.94),0 0 10px rgba(255,59,48,.45);''','''      color:#e8c680;\n      -webkit-text-stroke:.35px #4a2b18;\n      text-shadow:0 1px 5px rgba(35,18,8,.95),0 0 8px rgba(232,198,128,.32);''')
          s = s.replace('''      12%{transform:scale(1.08)}\n      24%{transform:scale(1)}\n      36%{transform:scale(1.05)}''','''      12%{transform:scale(1.06)}\n      24%{transform:scale(1)}\n      36%{transform:scale(1.035)}''')
          if '#ff3b30' in s or '#ff5a52' in s or '#ff6a61' in s:
              raise SystemExit('Old red caption styles still present')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve portal caption contrast"
          git push
