name: Replace hero from uploaded JPG

on:
  push:
    paths:
      - '.github/workflows/replace-hero-from-jpg.yml'

permissions:
  contents: write

jobs:
  replace-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert uploaded JPG to optimized WebP
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path('assets/Replace_face_in_image_2K_20260929162442.jpg')
          dst = Path('assets/hero.webp')
          img = Image.open(src).convert('RGB')
          img.save(dst, 'WEBP', quality=82, method=6)
          print(f'{src} -> {dst}: {dst.stat().st_size} bytes')
          PY

      - name: Commit optimized hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero.webp
          git commit -m "Replace hero with uploaded image" || exit 0
          git push
