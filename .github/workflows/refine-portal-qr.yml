name: Refine portal QR

on:
  push:
    paths:
      - '.github/workflows/refine-portal-qr.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply QR portal layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          desktop = '''    .portal{
              background:url("assets/portal.webp") center center / cover no-repeat;
            }

            .portal::after{
              content:"";
              position:absolute;
              inset:0;
              pointer-events:none;
              background:
                radial-gradient(circle at 74.5% 40%,rgba(255,220,160,.08),transparent 28%),
                linear-gradient(90deg,rgba(6,7,6,.05),rgba(6,7,6,0) 52%,rgba(6,7,6,.06));
            }

            .portal-qr{
              position:absolute;
              z-index:2;
              left:74.5%;
              top:40.5%;
              transform:translate(-50%,-50%);
              width:clamp(250px,19vw,350px);
              aspect-ratio:1 / 1;
              display:block;
              padding:clamp(7px,.45vw,10px);
              border:0;
              background:rgba(248,236,214,.72);
              box-shadow:
                0 0 34px rgba(255,215,145,.16),
                0 0 10px rgba(255,215,145,.10);
              backdrop-filter:blur(1px);
              -webkit-backdrop-filter:blur(1px);
              transition:transform .25s ease,filter .25s ease;
            }

            .portal-qr img{
              display:block;
              width:100%;
              height:100%;
              object-fit:contain;
              aspect-ratio:1 / 1;
              filter:none;
            }

            .portal-qr:hover{
              transform:translate(-50%,-50%) scale(1.015);
              filter:brightness(1.02);
            }

            .portal-caption-wrap{
              position:absolute;
              z-index:2;
              left:74.5%;
              top:75.5%;
              transform:translateX(-50%);
              display:flex;
              flex-direction:column;
              align-items:center;
              justify-content:center;
              text-align:center;
              pointer-events:none;
            }

            .portal-caption{
              display:flex;
              align-items:center;
              justify-content:center;
              gap:12px;
              font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
              font-size:clamp(18px,1.35vw,26px);
              font-weight:400;
              letter-spacing:.20em;
              text-transform:uppercase;
              color:#f1d29b;
              text-shadow:
                0 2px 8px rgba(55,29,13,.88),
                0 0 14px rgba(255,196,106,.24);
              white-space:nowrap;
            }

            .portal-caption::before,
            .portal-caption::after{
              content:"";
              width:clamp(34px,3vw,58px);
              height:1px;
              background:linear-gradient(90deg,transparent,#e5bd76);
              box-shadow:0 0 6px rgba(229,189,118,.38);
            }

            .portal-caption::after{
              background:linear-gradient(90deg,#e5bd76,transparent);
            }

            .portal-ornament{
              display:block;
              margin-top:2px;
              font-family:Georgia,"Times New Roman",serif;
              font-size:clamp(12px,.85vw,16px);
              letter-spacing:.34em;
              color:#d8b27b;
              text-shadow:0 0 7px rgba(255,194,99,.35);
            }
'''

          s, n1 = re.subn(r'(?ms)^    \.portal\{.*?^    \.portal-qr:hover\{.*?^    \}\n', desktop, s, count=1)

          mobile = '''      .portal{background-position:77.5% center}

              .portal::after{
                background:radial-gradient(circle at 50% 40%,rgba(255,220,160,.10),transparent 34%);
              }

              .portal-qr{
                left:50%;
                top:41%;
                width:min(72vw,320px);
              }

              .portal-caption-wrap{
                left:50%;
                top:74%;
              }

              .portal-caption{
                gap:9px;
                font-size:clamp(18px,5vw,25px);
                letter-spacing:.15em;
              }

              .portal-caption::before,
              .portal-caption::after{width:32px}

              .portal-qr:hover{transform:translate(-50%,-50%)}
'''

          s, n2 = re.subn(r'(?ms)^      \.portal\{background-position:77\.5% center\}.*?^      \.portal-qr:hover\{transform:translate\(-50%,-50%\)\}\n', mobile, s, count=1)

          html = '''  <section class="portal" id="contact" aria-label="Contact portal">
            <a class="portal-qr" href="/contact/" aria-label="Open Yaroshade Studio contact page">
              <img src="assets/contact-qr.svg?v=7" alt="QR code opening the Yaroshade Studio contact page">
            </a>

            <div class="portal-caption-wrap" aria-hidden="true">
              <span class="portal-caption">Click or scan</span>
              <span class="portal-ornament">◇ ✦ ◇</span>
            </div>
          </section>'''

          s, n3 = re.subn(r'(?ms)^  <section class="portal" id="contact" aria-label="Contact portal">.*?^  </section>', html, s, count=1)

          if (n1, n2, n3) != (1, 1, 1):
              raise SystemExit(f'Unexpected replacements: desktop={n1}, mobile={n2}, html={n3}')

          checks = [
              'assets/contact-qr.svg?v=7',
              'aspect-ratio:1 / 1;',
              'class="portal-caption-wrap"',
              'top:75.5%;',
              'top:74%;'
          ]
          missing = [x for x in checks if x not in s]
          if missing:
              raise SystemExit(f'Missing expected changes: {missing}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes and remove one-time workflow
        run: |
          rm -f .github/workflows/refine-portal-qr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/refine-portal-qr.yml
          git commit -m "Use square SVG QR and separate portal caption"
          git push
