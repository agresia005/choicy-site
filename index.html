<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Yaroshade Studio — AI creative direction, fashion, product and film visuals.">
  <title>Yaroshade Studio</title>
  <style>
    :root{
      --text:#f6f3ec;
      --muted:rgba(246,243,236,.68);
      --line:rgba(255,255,255,.28);
      --glass:rgba(8,10,10,.20);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      margin:0;
      background:#080909;
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    a{color:inherit;text-decoration:none}

    .hero,
    .portal{
      min-height:100svh;
      position:relative;
      overflow:hidden;
    }

    .hero{
      padding:clamp(28px,4vw,60px);
      background:
        linear-gradient(90deg,rgba(5,7,7,.52) 0%,rgba(5,7,7,.12) 38%,rgba(5,7,7,.02) 69%,rgba(5,7,7,.16) 100%),
        linear-gradient(0deg,rgba(5,7,7,.26) 0%,rgba(5,7,7,0) 49%),
        url("assets/hero.webp") center center / cover no-repeat;
    }

    .hero-brand{
      position:absolute;
      z-index:5;
      top:clamp(24px,3vw,42px);
      left:clamp(24px,4vw,60px);
      font-size:clamp(19px,1.35vw,25px);
      font-weight:800;
      letter-spacing:.19em;
      text-transform:uppercase;
      background:linear-gradient(180deg,#fff2c8 0%,#e6c277 42%,#b17b35 100%);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      -webkit-text-stroke:.75px rgba(255,255,255,.92);
      text-shadow:0 1px 2px rgba(0,0,0,.45);
    }

    .hero-copy{
      position:absolute;
      z-index:3;
      left:calc(45.5% + 120px);
      top:calc(15% + 20px);
      width:min(860px,53vw);
      max-width:none;
      padding:0;
    }

    h1{
      margin:0;
      max-width:860px;
      font-size:clamp(82px,7.4vw,132px);
      line-height:.88;
      letter-spacing:-.065em;
      font-weight:690;
      text-wrap:balance;
      text-shadow:
        0 8px 32px rgba(0,0,0,.34),
        0 2px 4px rgba(0,0,0,.20);
    }

    .nowrap{white-space:nowrap}

    .lead{
      margin:32px 0 0;
      position:relative;
      left:0;
      display:block;
      width:max-content;
      max-width:100%;
      white-space:nowrap;
      font-family:"Arial Black",Inter,ui-sans-serif,system-ui,sans-serif;
      font-size:clamp(28px,2.05vw,38px);
      line-height:1.05;
      font-weight:900;
      letter-spacing:.075em;
      text-transform:uppercase;
      color:rgba(255,255,255,.93);
      text-shadow:0 2px 12px rgba(0,0,0,.46);
      transform:scaleX(1.22);
      transform-origin:left center;
    }

    .actions{
      position:absolute;
      inset:0;
      z-index:4;
      pointer-events:none;
      perspective:1000px;
    }

    .nav-item{
      pointer-events:auto;
      color:var(--text);
    }

    .portfolio-link,
    .contact-link{
      overflow:visible;
      background:
        linear-gradient(145deg,rgba(91,72,58,.95),rgba(45,36,30,.97) 48%,rgba(23,22,20,.98));
      border:1px solid rgba(255,225,188,.34);
      box-shadow:
        0 22px 34px rgba(0,0,0,.38),
        0 8px 12px rgba(0,0,0,.30),
        inset 0 1px 0 rgba(255,255,255,.18),
        inset 0 -10px 20px rgba(0,0,0,.19);
      backdrop-filter:blur(5px);
      -webkit-backdrop-filter:blur(5px);
      text-shadow:0 2px 10px rgba(0,0,0,.60);
    }

    .portfolio-link{
      position:absolute;
      right:clamp(38px,4.5vw,82px);
      bottom:24%;
      width:clamp(300px,24vw,440px);
      min-height:96px;
      display:flex;
      align-items:center;
      gap:22px;
      padding:0 26px 0 28px;
      border-radius:8px 14px 7px 11px;
      transform:perspective(900px) rotateX(3deg) rotateY(-6deg);
      font-size:clamp(17px,1.18vw,22px);
      font-weight:820;
      letter-spacing:.15em;
      text-transform:uppercase;
      transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease;
    }

    .portfolio-link::after,
    .contact-link::after{
      content:"";
      position:absolute;
      z-index:-1;
      left:12px;
      right:-10px;
      bottom:-12px;
      height:18px;
      border-radius:0 0 12px 12px;
      background:linear-gradient(90deg,rgba(24,18,15,.82),rgba(8,8,8,.92));
      filter:blur(.2px);
      box-shadow:0 12px 20px rgba(0,0,0,.34);
      transform:skewX(-8deg);
    }

    .portfolio-link .desktop-arrow{
      margin-left:auto;
      font-size:clamp(56px,4.5vw,82px);
      line-height:.55;
      font-weight:280;
      letter-spacing:0;
      transition:transform .24s ease;
    }

    .portfolio-link:hover{
      transform:perspective(900px) rotateX(1deg) rotateY(-2deg) translateY(-6px);
      border-color:rgba(255,226,190,.62);
      box-shadow:
        0 30px 48px rgba(0,0,0,.46),
        0 12px 18px rgba(0,0,0,.30),
        inset 0 1px 0 rgba(255,255,255,.23),
        inset 0 -8px 18px rgba(0,0,0,.16);
    }

    .portfolio-link:hover .desktop-arrow{transform:translateX(13px)}

    .instagram-link{
      position:absolute;
      top:clamp(26px,3vw,46px);
      right:clamp(30px,4.5vw,72px);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#1b1d20;
    }

    .ig-mark{
      width:74px;
      height:74px;
      display:grid;
      place-items:center;
      border:1px solid rgba(255,255,255,.60);
      border-radius:16px;
      background:
        linear-gradient(145deg,#f1f2f3 0%,#c9ccd0 28%,#8a8f95 58%,#d9dbde 79%,#777c82 100%);
      box-shadow:
        0 13px 24px rgba(0,0,0,.32),
        0 0 18px rgba(210,215,220,.16),
        inset 0 1px 0 rgba(255,255,255,.70),
        inset 0 -1px 0 rgba(0,0,0,.18);
      transition:transform .22s ease,box-shadow .22s ease;
    }

    .ig-mark svg{
      width:34px;
      height:34px;
      display:block;
      color:#202327;
      filter:drop-shadow(0 1px 1px rgba(255,255,255,.30));
    }

    .instagram-link:hover .ig-mark{
      transform:translateY(-4px) rotate(4deg) scale(1.05);
      box-shadow:
        0 18px 28px rgba(0,0,0,.38),
        0 0 24px rgba(220,224,228,.24),
        inset 0 1px 0 rgba(255,255,255,.78),
        inset 0 -1px 0 rgba(0,0,0,.16);
    }

    .contact-link{
      position:absolute;
      right:clamp(58px,7vw,132px);
      bottom:7.5%;
      min-width:clamp(210px,17vw,300px);
      min-height:74px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding:0 22px 0 24px;
      border-radius:12px 7px 11px 7px;
      transform:perspective(850px) rotateX(-2deg) rotateY(-5deg);
      font-size:clamp(14px,1vw,18px);
      font-weight:820;
      letter-spacing:.16em;
      text-transform:uppercase;
      transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease;
    }

    .contact-link .desktop-arrow{
      font-size:44px;
      line-height:1;
      font-weight:280;
      transition:transform .24s ease;
    }

    .contact-link:hover{
      transform:perspective(850px) rotateX(0) rotateY(-1deg) translateY(-5px);
      border-color:rgba(255,226,190,.60);
      box-shadow:
        0 28px 42px rgba(0,0,0,.44),
        0 10px 16px rgba(0,0,0,.30),
        inset 0 1px 0 rgba(255,255,255,.22),
        inset 0 -8px 18px rgba(0,0,0,.16);
    }

    .contact-link:hover .desktop-arrow{transform:translateY(8px)}

    .mobile-arrow{display:none}

    .portal{
      background:url("assets/portal.webp") center center / cover no-repeat;
    }

    .portal::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 61.8% 48%,rgba(255,220,160,.10),transparent 30%),
        linear-gradient(90deg,rgba(6,7,6,.06),rgba(6,7,6,0) 52%,rgba(6,7,6,.08));
    }

    .portal-qr{
      position:absolute;
      z-index:2;
      left:61.8%;
      top:48.5%;
      transform:translate(-50%,-50%);
      width:clamp(300px,22vw,420px);
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:0;
      border:0;
      background:transparent;
      transition:transform .25s ease,filter .25s ease;
    }

    .portal-qr img{
      display:block;
      width:100%;
      height:auto;
      image-rendering:pixelated;
      image-rendering:crisp-edges;
      filter:drop-shadow(0 0 9px rgba(255,202,116,.20));
    }

    .portal-caption{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      margin-top:clamp(7px,.8vw,12px);
      font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
      font-size:clamp(18px,1.35vw,26px);
      font-weight:400;
      letter-spacing:.20em;
      text-transform:uppercase;
      color:#f1d29b;
      text-shadow:
        0 2px 8px rgba(55,29,13,.88),
        0 0 14px rgba(255,196,106,.24);
      white-space:nowrap;
    }

    .portal-caption::before,
    .portal-caption::after{
      content:"";
      width:clamp(34px,3vw,58px);
      height:1px;
      background:linear-gradient(90deg,transparent,#e5bd76);
      box-shadow:0 0 6px rgba(229,189,118,.38);
    }

    .portal-caption::after{
      background:linear-gradient(90deg,#e5bd76,transparent);
    }

    .portal-ornament{
      display:block;
      margin-top:2px;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(12px,.85vw,16px);
      letter-spacing:.34em;
      color:#d8b27b;
      text-shadow:0 0 7px rgba(255,194,99,.35);
    }

    .portal-qr:hover{
      transform:translate(-50%,-50%) scale(1.015);
      filter:brightness(1.03);
    }

    @media(max-width:760px){
      .hero{
        padding:20px 18px 24px;
        background-position:37% center;
      }

      .hero-brand{top:20px;left:18px;font-size:16px;-webkit-text-stroke:.55px rgba(255,255,255,.88)}

      .hero-copy{
        position:absolute;
        top:max(72px,calc(clamp(105px,16svh,150px) - 8svh));
        left:18px;
        right:18px;
        width:auto;
        max-width:none;
        padding:0;
      }

      h1{
        max-width:100%;
        font-size:clamp(52px,13.5vw,68px);
      }

      .lead{
        margin-top:22px;
        left:0;
        width:auto;
        max-width:100%;
        font-size:15px;
        font-weight:900;
        letter-spacing:.07em;
        transform:none;
      }

      .actions{
        inset:auto 18px 24px 18px;
        display:flex;
        flex-direction:column;
        gap:8px;
        pointer-events:auto;
        perspective:none;
      }

      .portfolio-link,
      .instagram-link,
      .contact-link{
        position:static;
        width:100%;
        min-width:0;
        min-height:46px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:0 14px;
        border:1px solid var(--line);
        border-radius:0;
        background:var(--glass);
        box-shadow:none;
        backdrop-filter:blur(12px);
        -webkit-backdrop-filter:blur(12px);
        transform:none;
        font-size:10px;
        font-weight:720;
        letter-spacing:.16em;
        text-transform:uppercase;
        color:var(--text);
        text-shadow:none;
      }

      .portfolio-link::after,
      .contact-link::after{display:none}

      .desktop-arrow{display:none}
      .ig-mark{display:grid;width:58px;height:58px}
      .ig-mark svg{width:27px;height:27px}
      .instagram-link{justify-content:center}
      .mobile-arrow{display:block;font-size:14px;opacity:.72}
      .portfolio-link:hover,.instagram-link:hover,.contact-link:hover{
        transform:none;
        background:var(--glass);
        box-shadow:none;
      }

      .portal{background-position:77.5% center}

      .portal::after{
        background:radial-gradient(circle at 50% 47%,rgba(255,220,160,.10),transparent 38%);
      }

      .portal-qr{
        left:50%;
        top:48%;
        width:min(84vw,430px);
      }

      .portal-caption{
        gap:9px;
        margin-top:7px;
        font-size:clamp(18px,5vw,25px);
        letter-spacing:.15em;
      }

      .portal-caption::before,
      .portal-caption::after{width:32px}

      .portal-qr:hover{transform:translate(-50%,-50%)}
    }
  </style>
</head>
<body>
  <section class="hero" id="home">
    <a class="hero-brand" href="#home">Yaroshade Studio</a>

    <div class="hero-copy">
      <h1>Enter the <span class="nowrap">visual world</span></h1>
      <p class="lead">Fashion · Product · Film</p>
    </div>

    <nav class="actions" aria-label="Main navigation">
      <a class="nav-item portfolio-link" href="https://yaroshade.my.canva.site" target="_blank" rel="noopener">
        <span>Portfolio</span>
        <span class="desktop-arrow" aria-hidden="true">→</span>
        <span class="mobile-arrow" aria-hidden="true">↗</span>
      </a>

      <a class="nav-item instagram-link" href="https://www.instagram.com/yaroshade.studio/" target="_blank" rel="noopener" aria-label="Instagram">
        <span class="ig-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.5" cy="6.5" r=".8" fill="currentColor" stroke="none"></circle>
          </svg>
        </span>
        <span class="mobile-arrow" aria-hidden="true">↗</span>
      </a>

      <a class="nav-item contact-link" href="#contact">
        <span>Contact</span>
        <span class="desktop-arrow" aria-hidden="true">↓</span>
        <span class="mobile-arrow" aria-hidden="true">↓</span>
      </a>
    </nav>
  </section>

  <section class="portal" id="contact" aria-label="Contact portal">
    <a class="portal-qr" href="/contact/" aria-label="Open Yaroshade Studio contact page">
      <img src="assets/contact-qr.png?v=5" alt="QR code opening the Yaroshade Studio contact page">
      <span class="portal-caption">Click or scan</span>
      <span class="portal-ornament" aria-hidden="true">◇ ✦ ◇</span>
    </a>
  </section>
</body>
</html>
