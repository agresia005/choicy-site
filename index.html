<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Yaroshade Studio — AI video, fashion and product creative for brands.">
  <title>Yaroshade Studio</title>
  <style>
    :root{
      --bg:#0a0a0a;
      --panel:#111;
      --text:#f3f0e9;
      --muted:#9b9b97;
      --line:#282824;
      --accent:#d6ff3f;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit;text-decoration:none}
    .wrap{width:min(1120px,calc(100% - 40px));margin:auto}
    .hero{
      min-height:100svh;
      position:relative;
      display:flex;
      align-items:flex-end;
      overflow:hidden;
      padding:clamp(28px,4vw,60px);
      background:
        linear-gradient(90deg,rgba(6,7,7,.60) 0%,rgba(6,7,7,.18) 42%,rgba(6,7,7,.08) 70%,rgba(6,7,7,.34) 100%),
        linear-gradient(0deg,rgba(6,7,7,.48) 0%,rgba(6,7,7,0) 42%),
        url("assets/hero.webp") center center / cover no-repeat;
    }
    .hero-brand{
      position:absolute;
      top:clamp(24px,3vw,42px);
      left:clamp(24px,4vw,60px);
      z-index:2;
      font-size:12px;
      font-weight:750;
      letter-spacing:.20em;
      text-transform:uppercase;
      text-shadow:0 2px 18px rgba(0,0,0,.55);
    }
    .hero-copy{
      position:relative;
      z-index:2;
      max-width:min(660px,65vw);
      padding-bottom:clamp(8px,1vw,14px);
    }
    .eyebrow{
      margin:0 0 14px;
      font-size:11px;
      letter-spacing:.20em;
      text-transform:uppercase;
      color:rgba(255,255,255,.72);
    }
    h1{
      max-width:640px;
      margin:0;
      font-size:clamp(54px,7vw,108px);
      line-height:.90;
      letter-spacing:-.06em;
      font-weight:690;
      text-shadow:0 8px 32px rgba(0,0,0,.34);
    }
    .lead{
      max-width:520px;
      margin:22px 0 0;
      font-size:clamp(16px,1.45vw,21px);
      line-height:1.4;
      color:rgba(255,255,255,.78);
      letter-spacing:.01em;
      text-shadow:0 3px 18px rgba(0,0,0,.42);
    }
    .actions{
      position:absolute;
      z-index:3;
      right:clamp(24px,4vw,60px);
      top:50%;
      transform:translateY(-50%);
      display:flex;
      flex-direction:column;
      gap:10px;
      width:min(170px,18vw);
    }
    .btn{
      display:flex;
      align-items:center;
      justify-content:space-between;
      min-height:52px;
      padding:0 16px;
      border:1px solid rgba(255,255,255,.28);
      background:rgba(8,10,10,.24);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      font-size:11px;
      font-weight:700;
      letter-spacing:.13em;
      text-transform:uppercase;
      transition:.22s ease;
    }
    .btn::after{content:"↗";font-size:14px;opacity:.70}
    .btn.contact::after{content:"↓"}
    .btn:hover{
      transform:translateX(-5px);
      background:rgba(255,255,255,.10);
      border-color:rgba(255,255,255,.56);
    }
    .portal{
      min-height:100svh;
      position:relative;
      overflow:hidden;
      padding:0;
      border:0;
      background:url("assets/portal.webp") center center / cover no-repeat;
    }
    section{padding:78px 0;border-top:1px solid var(--line)}
    .section-title{
      margin:0 0 34px;
      font-size:12px;
      color:var(--muted);
      letter-spacing:.16em;
      text-transform:uppercase;
    }
    .services{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      border:1px solid var(--line);
    }
    .service{padding:30px;min-height:190px}
    .service+.service{border-left:1px solid var(--line)}
    .service h2{margin:0 0 16px;font-size:24px;letter-spacing:-.03em}
    .service p{margin:0;color:var(--muted);line-height:1.6}
    .statement{
      max-width:900px;
      margin:0;
      font-size:clamp(30px,5vw,62px);
      line-height:1.03;
      letter-spacing:-.045em;
    }
    .contact{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:30px;
    }
    .contact h2{
      margin:0;
      max-width:760px;
      font-size:clamp(38px,6vw,78px);
      line-height:.98;
      letter-spacing:-.055em;
    }
    .contact-links{display:flex;flex-direction:column;gap:10px;white-space:nowrap}
    .contact-links a{color:var(--muted)}
    .contact-links a:hover{color:var(--text)}
    footer{
      padding:28px 0 38px;
      border-top:1px solid var(--line);
      color:#676762;
      font-size:12px;
      display:flex;
      justify-content:space-between;
      gap:20px;
    }
    @media(max-width:760px){
      .wrap{width:min(100% - 28px,1120px)}
      .hero{
        min-height:100svh;
        padding:22px 18px 26px;
        align-items:flex-end;
        background-position:58% center;
      }
      .hero-brand{top:20px;left:18px}
      .hero-copy{
        max-width:100%;
        padding:0 0 182px;
      }
      h1{font-size:clamp(50px,16vw,76px);max-width:92%}
      .lead{font-size:16px;max-width:82%;margin-top:16px}
      .actions{
        left:18px;
        right:18px;
        bottom:26px;
        top:auto;
        width:auto;
        transform:none;
        gap:8px;
      }
      .btn{min-height:46px}
      .btn:hover{transform:none}
      .portal{
        min-height:100svh;
        padding:0;
        background-position:64% center;
      }
      section{padding:58px 0}
      .services{grid-template-columns:1fr}
      .service{min-height:auto}
      .service+.service{border-left:0;border-top:1px solid var(--line)}
      .contact{align-items:flex-start;flex-direction:column}
      footer{flex-direction:column}
    }
  </style>
</head>
<body>
  <section class="hero" id="home">
    <a class="hero-brand" href="#home">Yaroshade Studio</a>

    <div class="hero-copy">
      <p class="eyebrow">AI Creative Studio</p>
      <h1>Enter the visual world.</h1>
      <p class="lead">Fashion · Product · Film</p>
    </div>

    <div class="actions">
      <a class="btn" href="https://yaroshade.my.canva.site" target="_blank" rel="noopener">Portfolio</a>
      <a class="btn" href="https://www.instagram.com/yaroshade.studio/" target="_blank" rel="noopener">Instagram</a>
      <a class="btn contact" href="#contact">Contact</a>
    </div>
  </section>
  <section class="portal" id="contact" aria-label="Contact portal"></section>
</body>
</html>
