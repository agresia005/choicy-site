<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Yaroshade Studio — AI creative direction, fashion, product and film visuals.">
  <title>Yaroshade Studio</title>
  <style>
    :root{
      --text:#f6f3ec;
      --muted:rgba(246,243,236,.68);
      --line:rgba(255,255,255,.28);
      --glass:rgba(8,10,10,.20);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      margin:0;
      background:#080909;
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    a{color:inherit;text-decoration:none}

    .hero,
    .portal{
      min-height:100svh;
      position:relative;
      overflow:hidden;
    }

    .hero{
      display:flex;
      align-items:flex-end;
      padding:clamp(28px,4vw,60px);
      background:
        linear-gradient(90deg,rgba(5,7,7,.64) 0%,rgba(5,7,7,.22) 38%,rgba(5,7,7,.05) 64%,rgba(5,7,7,.30) 100%),
        linear-gradient(0deg,rgba(5,7,7,.42) 0%,rgba(5,7,7,0) 44%),
        url("assets/hero.webp") center center / cover no-repeat;
    }

    .hero-brand{
      position:absolute;
      z-index:3;
      top:clamp(24px,3vw,42px);
      left:clamp(24px,4vw,60px);
      font-size:12px;
      font-weight:760;
      letter-spacing:.22em;
      text-transform:uppercase;
      text-shadow:0 2px 18px rgba(0,0,0,.55);
    }

    .hero-copy{
      position:relative;
      z-index:2;
      max-width:min(680px,64vw);
      padding-bottom:clamp(8px,1vw,14px);
    }

    .eyebrow{
      margin:0 0 14px;
      font-size:10px;
      font-weight:650;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:var(--muted);
    }

    h1{
      margin:0;
      max-width:650px;
      font-size:clamp(54px,7.2vw,112px);
      line-height:.88;
      letter-spacing:-.065em;
      font-weight:680;
      text-wrap:balance;
      text-shadow:0 8px 34px rgba(0,0,0,.34);
    }

    .lead{
      margin:20px 0 0;
      font-size:clamp(14px,1.15vw,18px);
      line-height:1.4;
      letter-spacing:.06em;
      text-transform:uppercase;
      color:rgba(255,255,255,.72);
      text-shadow:0 3px 18px rgba(0,0,0,.40);
    }

    .actions{
      position:absolute;
      z-index:4;
      right:clamp(24px,4vw,60px);
      top:50%;
      transform:translateY(-50%);
      width:min(178px,19vw);
      display:flex;
      flex-direction:column;
      gap:9px;
    }

    .btn{
      min-height:54px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 17px;
      border:1px solid var(--line);
      background:var(--glass);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      font-size:10px;
      font-weight:720;
      letter-spacing:.16em;
      text-transform:uppercase;
      transition:transform .22s ease,background .22s ease,border-color .22s ease;
    }

    .btn::after{
      content:"↗";
      font-size:14px;
      line-height:1;
      opacity:.72;
    }

    .btn.contact::after{content:"→"}

    .btn:hover{
      transform:translateX(-5px);
      background:rgba(255,255,255,.10);
      border-color:rgba(255,255,255,.58);
    }

    .portal{
      background:url("assets/portal.webp") center center / cover no-repeat;
    }

    .portal::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 61.8% 50%,rgba(255,221,171,.08),transparent 29%),
        linear-gradient(90deg,rgba(6,7,6,.10),rgba(6,7,6,0) 52%,rgba(6,7,6,.14));
    }

    .portal-qr{
      position:absolute;
      z-index:2;
      left:61.8%;
      top:50%;
      transform:translate(-50%,-50%);
      width:clamp(250px,27vw,430px);
      padding:clamp(10px,1vw,15px);
      border:1px solid rgba(230,191,128,.55);
      background:rgba(46,28,18,.42);
      box-shadow:
        0 24px 80px rgba(0,0,0,.38),
        0 0 44px rgba(224,176,105,.12),
        inset 0 0 0 1px rgba(255,255,255,.06);
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
      transition:transform .25s ease,box-shadow .25s ease;
    }

    .portal-qr img{
      display:block;
      width:100%;
      height:auto;
    }

    .portal-qr span{
      display:block;
      padding:10px 4px 1px;
      text-align:center;
      font-size:9px;
      font-weight:720;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:rgba(246,243,236,.72);
    }

    .portal-qr:hover{
      transform:translate(-50%,-50%) scale(1.018);
      box-shadow:
        0 28px 90px rgba(0,0,0,.44),
        0 0 54px rgba(224,176,105,.18),
        inset 0 0 0 1px rgba(255,255,255,.10);
    }

    @media(max-width:760px){
      .hero{
        padding:20px 18px 24px;
        background-position:37% center;
      }

      .hero-brand{
        top:20px;
        left:18px;
      }

      .hero-copy{
        position:absolute;
        top:max(72px,calc(clamp(105px,16svh,150px) - 8svh));
        left:18px;
        right:18px;
        max-width:none;
        padding:0;
      }

      h1{
        max-width:92%;
        font-size:clamp(46px,13.5vw,64px);
      }

      .lead{
        margin-top:12px;
        font-size:12px;
      }

      .actions{
        left:18px;
        right:18px;
        bottom:24px;
        top:auto;
        width:auto;
        transform:none;
        gap:8px;
      }

      .btn{
        min-height:46px;
        padding:0 14px;
      }

      .btn:hover{transform:none}

      .portal{background-position:77.5% center}

      .portal-qr{
        left:62%;
        top:53%;
        width:min(68vw,330px);
      }

      .portal-qr:hover{
        transform:translate(-50%,-50%);
      }
    }
  </style>
</head>
<body>
  <section class="hero" id="home">
    <a class="hero-brand" href="#home">Yaroshade Studio</a>

    <div class="hero-copy">
      <p class="eyebrow">AI Creative Studio</p>
      <h1>Enter the visual world.</h1>
      <p class="lead">Fashion · Product · Film</p>
    </div>

    <nav class="actions" aria-label="Main navigation">
      <a class="btn" href="https://yaroshade.my.canva.site" target="_blank" rel="noopener">Portfolio</a>
      <a class="btn" href="https://www.instagram.com/yaroshade.studio/" target="_blank" rel="noopener">Instagram</a>
      <a class="btn contact" href="/contact/">Contact</a>
    </nav>
  </section>

  <section class="portal" id="contact" aria-label="Contact portal">
    <a class="portal-qr" href="/contact/" aria-label="Open Yaroshade Studio contact page">
      <img src="assets/contact-qr.png" alt="QR code opening the Yaroshade Studio contact page">
      <span>Open contact portal</span>
    </a>
  </section>
</body>
</html>
