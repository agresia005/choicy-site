<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Yaroshade Studio — AI creative direction, fashion, product and film visuals.">
  <title>Yaroshade Studio</title>
  <style>
    :root{
      --text:#f6f3ec;
      --muted:rgba(246,243,236,.68);
      --line:rgba(255,255,255,.28);
      --glass:rgba(8,10,10,.20);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      margin:0;
      background:#080909;
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    a{color:inherit;text-decoration:none}

    .hero,
    .portal{
      min-height:100svh;
      position:relative;
      overflow:hidden;
    }

    .hero{
      padding:clamp(28px,4vw,60px);
      background:
        linear-gradient(90deg,rgba(5,7,7,.55) 0%,rgba(5,7,7,.14) 38%,rgba(5,7,7,.03) 68%,rgba(5,7,7,.18) 100%),
        linear-gradient(0deg,rgba(5,7,7,.28) 0%,rgba(5,7,7,0) 48%),
        url("assets/hero.webp") center center / cover no-repeat;
    }

    .hero-brand{
      position:absolute;
      z-index:5;
      top:clamp(24px,3vw,42px);
      left:clamp(24px,4vw,60px);
      font-size:12px;
      font-weight:760;
      letter-spacing:.22em;
      text-transform:uppercase;
      text-shadow:0 2px 18px rgba(0,0,0,.55);
    }

    .hero-copy{
      position:absolute;
      z-index:3;
      left:45%;
      top:14%;
      width:min(520px,36vw);
      max-width:none;
      padding:0;
    }

    .eyebrow{
      margin:0 0 10px;
      font-size:10px;
      font-weight:650;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:rgba(255,255,255,.64);
      text-shadow:0 3px 18px rgba(0,0,0,.40);
    }

    h1{
      margin:0;
      max-width:520px;
      font-size:clamp(52px,5.2vw,84px);
      line-height:.90;
      letter-spacing:-.06em;
      font-weight:680;
      text-wrap:balance;
      text-shadow:0 8px 32px rgba(0,0,0,.30);
    }

    .lead{
      margin:14px 0 0;
      font-size:clamp(11px,.95vw,15px);
      line-height:1.4;
      letter-spacing:.10em;
      text-transform:uppercase;
      color:rgba(255,255,255,.74);
      text-shadow:0 3px 18px rgba(0,0,0,.38);
    }

    .actions{
      position:absolute;
      inset:0;
      z-index:4;
      pointer-events:none;
    }

    .nav-item{
      pointer-events:auto;
      color:var(--text);
    }

    .portfolio-link{
      position:absolute;
      right:clamp(28px,4vw,70px);
      top:49%;
      width:clamp(250px,21vw,380px);
      display:flex;
      align-items:center;
      gap:18px;
      padding:14px 0 16px;
      border-top:1px solid rgba(255,255,255,.30);
      border-bottom:1px solid rgba(255,255,255,.30);
      font-size:12px;
      font-weight:760;
      letter-spacing:.18em;
      text-transform:uppercase;
      text-shadow:0 2px 14px rgba(0,0,0,.55);
      transition:border-color .22s ease,background .22s ease;
    }

    .portfolio-link::before{
      content:"Explore";
      position:absolute;
      top:-23px;
      left:0;
      font-size:8px;
      font-weight:650;
      letter-spacing:.24em;
      color:rgba(255,255,255,.56);
    }

    .portfolio-link .desktop-arrow{
      margin-left:auto;
      font-size:clamp(48px,4vw,72px);
      line-height:.55;
      font-weight:300;
      letter-spacing:0;
      transition:transform .24s ease;
    }

    .portfolio-link:hover{
      border-color:rgba(255,255,255,.64);
      background:linear-gradient(90deg,rgba(255,255,255,.04),transparent);
    }

    .portfolio-link:hover .desktop-arrow{transform:translateX(12px)}

    .instagram-link{
      position:absolute;
      top:clamp(25px,3vw,44px);
      right:clamp(26px,4vw,60px);
      display:flex;
      align-items:center;
      gap:11px;
      font-size:9px;
      font-weight:720;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:rgba(255,255,255,.72);
    }

    .ig-mark{
      width:46px;
      height:46px;
      display:grid;
      place-items:center;
      border:1px solid rgba(255,255,255,.34);
      border-radius:50%;
      background:rgba(8,10,10,.16);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      transition:transform .22s ease,background .22s ease,border-color .22s ease;
    }

    .ig-mark svg{width:19px;height:19px;display:block}

    .instagram-link:hover .ig-mark{
      transform:rotate(7deg) scale(1.07);
      background:rgba(255,255,255,.10);
      border-color:rgba(255,255,255,.62);
    }

    .contact-link{
      position:absolute;
      right:clamp(28px,4vw,70px);
      bottom:clamp(28px,4vw,60px);
      display:flex;
      align-items:center;
      gap:14px;
      font-size:10px;
      font-weight:760;
      letter-spacing:.19em;
      text-transform:uppercase;
      text-shadow:0 2px 14px rgba(0,0,0,.55);
    }

    .contact-link .desktop-arrow{
      font-size:34px;
      line-height:1;
      font-weight:300;
      transition:transform .24s ease;
    }

    .contact-link:hover .desktop-arrow{transform:translateY(8px)}

    .mobile-arrow{display:none}

    .portal{
      background:url("assets/portal.webp") center center / cover no-repeat;
    }

    .portal::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 61.8% 50%,rgba(255,221,171,.08),transparent 29%),
        linear-gradient(90deg,rgba(6,7,6,.10),rgba(6,7,6,0) 52%,rgba(6,7,6,.14));
    }

    .portal-qr{
      position:absolute;
      z-index:2;
      left:61.8%;
      top:50%;
      transform:translate(-50%,-50%);
      width:clamp(250px,27vw,430px);
      padding:clamp(10px,1vw,15px);
      border:1px solid rgba(230,191,128,.55);
      background:rgba(46,28,18,.42);
      box-shadow:
        0 24px 80px rgba(0,0,0,.38),
        0 0 44px rgba(224,176,105,.12),
        inset 0 0 0 1px rgba(255,255,255,.06);
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
      transition:transform .25s ease,box-shadow .25s ease;
    }

    .portal-qr img{display:block;width:100%;height:auto}

    .portal-qr span{
      display:block;
      padding:10px 4px 1px;
      text-align:center;
      font-size:9px;
      font-weight:720;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:rgba(246,243,236,.72);
    }

    .portal-qr:hover{
      transform:translate(-50%,-50%) scale(1.018);
      box-shadow:
        0 28px 90px rgba(0,0,0,.44),
        0 0 54px rgba(224,176,105,.18),
        inset 0 0 0 1px rgba(255,255,255,.10);
    }

    @media(max-width:760px){
      .hero{
        padding:20px 18px 24px;
        background-position:37% center;
      }

      .hero-brand{top:20px;left:18px}

      .hero-copy{
        position:absolute;
        top:max(72px,calc(clamp(105px,16svh,150px) - 8svh));
        left:18px;
        right:18px;
        width:auto;
        max-width:none;
        padding:0;
      }

      .eyebrow{margin-bottom:10px}

      h1{
        max-width:92%;
        font-size:clamp(46px,13.5vw,64px);
      }

      .lead{
        margin-top:12px;
        font-size:12px;
      }

      .actions{
        inset:auto 18px 24px 18px;
        display:flex;
        flex-direction:column;
        gap:8px;
        pointer-events:auto;
      }

      .portfolio-link,
      .instagram-link,
      .contact-link{
        position:static;
        width:100%;
        min-height:46px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:0 14px;
        border:1px solid var(--line);
        background:var(--glass);
        backdrop-filter:blur(12px);
        -webkit-backdrop-filter:blur(12px);
        font-size:10px;
        font-weight:720;
        letter-spacing:.16em;
        text-transform:uppercase;
        color:var(--text);
        text-shadow:none;
      }

      .portfolio-link::before{display:none}
      .desktop-arrow,.ig-mark{display:none}
      .mobile-arrow{display:block;font-size:14px;opacity:.72}
      .portfolio-link:hover,.instagram-link:hover,.contact-link:hover{background:var(--glass)}

      .portal{background-position:77.5% center}

      .portal-qr{
        left:62%;
        top:53%;
        width:min(68vw,330px);
      }

      .portal-qr:hover{transform:translate(-50%,-50%)}
    }
  </style>
</head>
<body>
  <section class="hero" id="home">
    <a class="hero-brand" href="#home">Yaroshade Studio</a>

    <div class="hero-copy">
      <p class="eyebrow">AI Creative Studio</p>
      <h1>Enter the visual world.</h1>
      <p class="lead">Fashion · Product · Film</p>
    </div>

    <nav class="actions" aria-label="Main navigation">
      <a class="nav-item portfolio-link" href="https://yaroshade.my.canva.site" target="_blank" rel="noopener">
        <span>Portfolio</span>
        <span class="desktop-arrow" aria-hidden="true">→</span>
        <span class="mobile-arrow" aria-hidden="true">↗</span>
      </a>

      <a class="nav-item instagram-link" href="https://www.instagram.com/yaroshade.studio/" target="_blank" rel="noopener">
        <span>Instagram</span>
        <span class="ig-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.5" cy="6.5" r=".8" fill="currentColor" stroke="none"></circle>
          </svg>
        </span>
        <span class="mobile-arrow" aria-hidden="true">↗</span>
      </a>

      <a class="nav-item contact-link" href="#contact">
        <span>Contact</span>
        <span class="desktop-arrow" aria-hidden="true">↓</span>
        <span class="mobile-arrow" aria-hidden="true">↓</span>
      </a>
    </nav>
  </section>

  <section class="portal" id="contact" aria-label="Contact portal">
    <a class="portal-qr" href="/contact/" aria-label="Open Yaroshade Studio contact page">
      <img src="assets/contact-qr.png" alt="QR code opening the Yaroshade Studio contact page">
      <span>Open contact portal</span>
    </a>
  </section>
</body>
</html>
